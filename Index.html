<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sentence Builder</title>
<style>
:root{
  --bg:#f4f7fb; --card:#fff; --ink:#1d2433; --muted:#5b6578; --line:#d9e0ea;
  --brand:#2f6fdb; --brand-ink:#fff; --ok:#1f9d55; --ok-bg:#e6f6ec; --warn:#b7791f; --warn-bg:#fdf3e1;
  --bad:#c53030; --bad-bg:#fde8e8; --radius:16px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:22px;margin:0;flex:1}
.chip{background:#eef3fc;color:var(--brand);border-radius:999px;padding:4px 12px;font-size:15px;font-weight:600}
.iconbtn{border:0;background:none;font-size:22px;cursor:pointer;padding:6px;border-radius:8px;color:var(--muted)}
.iconbtn:hover{background:#eef1f6}
main{max-width:820px;margin:24px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
h2{margin:0 0 12px;font-size:26px}
h3{margin:18px 0 8px;font-size:19px}
.prompt{font-size:26px;font-weight:600;display:flex;gap:12px;align-items:flex-start}
.prompt .iconbtn{font-size:26px}
textarea{width:100%;min-height:120px;font:inherit;font-size:24px;line-height:1.5;padding:14px;border:2px solid var(--line);border-radius:12px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:3px solid #bcd3fa;border-color:var(--brand)}
button.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 22px;cursor:pointer;background:var(--brand);color:var(--brand-ink)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.btn.big{font-size:22px;padding:16px 30px}
button.btn.ghost{background:#eef1f6;color:var(--ink)}
button.btn.danger{background:var(--bad)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
.muted{color:var(--muted)}
.small{font-size:15px}
.dots{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.dot{width:38px;height:38px;border-radius:50%;background:var(--warn);color:#fff;display:grid;place-items:center;font-weight:700}
.bigcount{font-size:28px;font-weight:700}
.sentence{font-size:24px;line-height:1.9;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
mark{border-radius:6px;padding:1px 3px}
mark.fixed{background:var(--ok-bg);border-bottom:3px solid var(--ok)}
mark.tried{background:var(--warn-bg);border-bottom:3px solid var(--warn)}
mark.missed{background:var(--bad-bg);border-bottom:3px solid var(--bad)}
.err{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.err:first-child{border-top:0}
.badge{font-size:14px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.badge.fixed{background:var(--ok-bg);color:var(--ok)}
.badge.tried{background:var(--warn-bg);color:var(--warn)}
.badge.missed{background:var(--bad-bg);color:var(--bad)}
.stars{font-size:40px;letter-spacing:4px}
.status{padding:12px 16px;border-radius:12px;margin-top:12px}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.status.warn{background:var(--warn-bg);color:var(--warn)}
/* teacher panel */
#overlay{position:fixed;inset:0;background:rgba(20,28,45,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:10}
#overlay.open{display:flex}
.panel{background:var(--card);border-radius:var(--radius);width:100%;max-width:900px;padding:22px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:16px;border:0;background:#eef1f6;border-radius:10px;padding:8px 14px;cursor:pointer}
.tabs button.on{background:var(--brand);color:#fff}
label.f{display:block;margin:12px 0 4px;font-weight:600;font-size:16px}
input[type=text],input[type=password],input[type=number],input[type=email],select,.panel textarea{width:100%;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:10px}
.panel textarea{min-height:90px}
.check{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f5f7fa}
.tablewrap{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:10px}
code{background:#f1f3f7;padding:1px 5px;border-radius:5px;font-size:.9em}
</style>
</head>
<body>
<header>
  <h1>✏️ Sentence Builder</h1>
  <span class="chip" id="studentChip"></span>
  <button class="iconbtn" title="Teacher settings" onclick="openTeacher()">⚙️</button>
</header>
<main id="app"></main>
<div id="overlay"><div class="panel" id="panel"></div></div>

/* =========================================================
   OFFLINE DICTIONARY — Hunspell en_US, embedded below in #dict-aff / #dict-dic.
   Word list © Kevin Atkinson (SCOWL), LGPL; affix rules from Ispell (Geoff Kuenning), BSD.
   ========================================================= */
let WORDS = null, STEMS = null, REP = [], DICT_READY = null;
// The dictionary is stored gzip-compressed + base64 in #dict-gz to keep the file small enough to paste into Google Sites.
function ensureDict(){
  if (!DICT_READY) DICT_READY = (async () => {
    const el = $("dict-gz"); if (!el) return;
    const bin = Uint8Array.from(atob(el.textContent.trim()), c => c.charCodeAt(0));
    const txt = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    const [aff, dic] = txt.split("\n@@SPLIT@@\n");
    buildDict(aff, dic);
  })().catch(e => console.warn("Dictionary failed to load", e));
  return DICT_READY;
}
function buildDict(affText, dicText){
  const rules = {};
  affText.split(/\r?\n/).forEach(line => {
    const p = line.trim().split(/\s+/);
    if ((p[0]==="PFX" || p[0]==="SFX") && p.length === 4 && !rules[p[1]]){
      rules[p[1]] = { type:p[0], cross:p[2]==="Y", entries:[] };
    } else if ((p[0]==="PFX" || p[0]==="SFX") && p.length >= 5 && rules[p[1]]){
      rules[p[1]].entries.push({ strip: p[2]==="0" ? "" : p[2], add: p[3]==="0" ? "" : p[3].split("/")[0],
        re: new RegExp(p[0]==="SFX" ? p[4]+"$" : "^"+p[4]) });
    } else if (p[0]==="REP" && p.length === 3) REP.push([p[1], p[2]]);
  });
  const words = new Set(), stems = new Set();
  const apply = (w, r) => r.entries.filter(e => e.re.test(w) && (r.type==="SFX" ? w.endsWith(e.strip) : w.startsWith(e.strip)))
    .map(e => r.type==="SFX" ? w.slice(0, w.length-e.strip.length)+e.add : e.add+w.slice(e.strip.length));
  dicText.split(/\r?\n/).slice(1).forEach(line => {
    const slash = line.indexOf("/");
    const w = (slash < 0 ? line : line.slice(0, slash)).trim();
    if (!w || /\d/.test(w)) return;
    const flags = slash < 0 ? "" : line.slice(slash+1).trim();
    words.add(w); stems.add(w);
    const crossForms = [];
    for (const f of flags){ const r = rules[f]; if (r && r.type==="SFX") apply(w,r).forEach(x => { words.add(x); if (r.cross) crossForms.push(x); }); }
    for (const f of flags){ const r = rules[f]; if (r && r.type==="PFX"){
      apply(w,r).forEach(x => words.add(x));
      if (r.cross) crossForms.forEach(s => apply(s,r).forEach(x => words.add(x)));
    } }
  });
  WORDS = words; STEMS = stems;
}

function isWord(w){
  if (!WORDS) return true;
  w = w.replace(/’/g,"'").replace(/^'+|'+$/g,"");
  if (!w || WORDS.has(w)) return true;
  const lw = w.toLowerCase();
  if (w === cap(lw) || w === w.toUpperCase()) return WORDS.has(lw) || WORDS.has(cap(lw));
  return false;
}

function allowedWords(){
  const list = (S.allowedWords || "").split(/[\s,]+/).concat(SESSION ? SESSION.student.split(/\s+/) : []);
  return new Set(list.map(x => x.toLowerCase().replace(/'s$/,"")).filter(Boolean));
}

const ALPHA = "abcdefghijklmnopqrstuvwxyz";
function edits1(w){
  const out = new Set();
  for (let i = 0; i <= w.length; i++){
    const a = w.slice(0,i), b = w.slice(i);
    if (b) out.add(a + b.slice(1));
    if (b.length > 1) out.add(a + b[1] + b[0] + b.slice(2));
    for (const c of ALPHA){ if (b) out.add(a + c + b.slice(1)); out.add(a + c + b); }
  }
  out.delete(w); return out;
}
function repEdits(w){
  const out = new Set();
  REP.forEach(([f,t]) => { let i = w.indexOf(f); while (i >= 0){ out.add(w.slice(0,i) + t + w.slice(i+f.length)); i = w.indexOf(f, i+1); } });
  return out;
}
function soundex(w){
  const codes = {b:1,f:1,p:1,v:1,c:2,g:2,j:2,k:2,q:2,s:2,x:2,z:2,d:3,t:3,l:4,m:5,n:5,r:6};
  let out = w[0], last = codes[w[0]] || 0;
  for (const ch of w.slice(1)){
    const c = codes[ch] || 0;
    if (c && c !== last) out += c;
    if (ch !== "h" && ch !== "w") last = c;
  }
  return (out + "000").slice(0,4);
}
function suggestWord(w){
  const lw = w.toLowerCase(), found = new Map();
  const consider = (c, d) => { if (!found.has(c) && (WORDS.has(c) || WORDS.has(cap(c)))) found.set(c, d); };
  const e1 = edits1(lw), r1 = repEdits(lw);
  e1.forEach(c => consider(c,1)); r1.forEach(c => consider(c,1));
  if (!found.size && lw.length <= 12){
    e1.forEach(a => edits1(a).forEach(c => consider(c,2)));
    r1.forEach(a => edits1(a).forEach(c => consider(c,2)));
  }
  if (!found.size) return "";
  const sx = soundex(lw); let best = null, bestScore = Infinity;
  found.forEach((d, c) => {
    let s = d * 10 + Math.abs(c.length - lw.length) * 0.5;
    if (c[0] === lw[0]) s -= 3;                                   // kids usually get the first letter right
    if (soundex(c) === sx) s -= 4;                               // sounds the same
    if (STEMS.has(c)) s -= 2;                                    // base words are more common
    if (!WORDS.has(c)) s += 3;                                   // proper noun only
    if (c === lw + "e") s -= 3;                                  // dropped silent e (lik -> like)
    if (c === lw.replace(/(.)\1/, "$1") || c.replace(/(.)\1/, "$1") === lw) s -= 3; // doubled letters (dogg, litle)
    if (c.includes("'") && !lw.includes("'")) s += 2;
    if (s < bestScore || (s === bestScore && c < best)){ best = c; bestScore = s; }
  });
  return matchCase(w, WORDS.has(best) ? best : cap(best));
}

const DOUBLE_OK = new Set(["had","that","very","so","really","bye","no","ha","go"]);
function needsAn(w){
  const l = w.toLowerCase();
  if (/^(one|once|uni|use|usu|eu|ewe|ur)/.test(l)) return false;
  if (/^(hour|honest|honor|heir)/.test(l)) return true;
  return /^[aeiou]/.test(l);
}

function builtinCheck(text){
  const out = [], allowed = allowedWords();
  const add = (offset, length, type, key, message, suggestion, sigByKeyOnly) => {
    const bad = text.substr(offset, length);
    out.push({ offset, length, bad, type, key, message, suggestion, sig: sigByKeyOnly ? key : key+"|"+bad.toLowerCase(), src:"built-in" });
  };

  // 1. First word capitalized
  const first = text.match(/[A-Za-z][A-Za-z']*/);
  if (first && first[0][0] !== first[0][0].toUpperCase()){
    add(first.index, first[0].length, "Capitalization", "CAP_START", "The first word of a sentence starts with a capital letter.", cap(first[0]), true);
  }

  // 2. End punctuation
  if (text && !/[.!?]["')\]]?$/.test(text)){
    const last = text.match(/(\S+)$/);
    // zero-length at the very end so it doesn't collide with other errors on the last word
    if (last) out.push({ offset: text.length, length: 0, bad: last[1], type: "Punctuation", key: "END_PUNCT",
      message: "A sentence ends with a period, question mark, or exclamation point.", suggestion: last[1]+".", insert: ".", sig: "END_PUNCT", src: "built-in" });
  }

  // 3. Word-level rules
  const wordRe = /[A-Za-z']+/g; let m, prev = null;
  while ((m = wordRe.exec(text))){
    const w = m[0], lw = w.toLowerCase().replace(/^'+|'+$/g,"");
    const isStart = first && m.index === first.index;
    if (/^i('m|'ll|'d|'ve)?$/.test(w)){
      add(m.index, w.length, "Capitalization", "CAP_I", "The word \"I\" is always a capital letter.", "I"+w.slice(1));
    } else if (CONTRACTIONS[lw]){
      add(m.index, w.length, "Punctuation", "APOSTROPHE", "This word needs an apostrophe ( ' ).", matchCase(w, CONTRACTIONS[lw]));
    } else if (MISSPELL[lw]){
      add(m.index, w.length, "Spelling", "SPELL", "This word is not spelled correctly.", matchCase(w, MISSPELL[lw]));
    } else if (PROPER.has(lw) && w[0] !== w[0].toUpperCase() && !isStart){
      add(m.index, w.length, "Capitalization", "CAP_PROPER", "Names of days, months, places, and holidays start with a capital letter.", cap(w));
    } else if (WORDS && !allowed.has(lw) && !isWord(w)){
      if (w === w.toLowerCase() && WORDS.has(cap(lw))){
        if (!isStart) add(m.index, w.length, "Capitalization", "CAP_PROPER", "Names of people, places, days, and months start with a capital letter.", cap(lw));
      } else if (w[0] === w[0].toUpperCase() && !isStart){
        // capitalized unknown word mid-sentence: most likely a name — don't count it
      } else {
        add(m.index, w.length, "Spelling", "DICT_SPELL", "This word is not spelled correctly.", suggestWord(w));
      }
    }
    if (prev){
      const between = text.slice(prev.index + prev.w.length, m.index);
      if (/^\s+$/.test(between)){
        if (prev.lw === lw && !DOUBLE_OK.has(lw)){
          add(prev.index, m.index + w.length - prev.index, "Grammar", "REPEAT", "The same word is written twice in a row.", prev.w);
        }
        if (prev.lw === "a" && needsAn(w)) add(prev.index, 1, "Grammar", "A_AN", "Use \"an\" before a word that starts with a vowel sound.", matchCase(prev.w,"an"));
        if (prev.lw === "an" && !needsAn(w) && /^[a-z]/i.test(w)) add(prev.index, 2, "Grammar", "A_AN", "Use \"a\" before a word that starts with a consonant sound.", matchCase(prev.w,"a"));
      }
    }
    prev = { w, lw, index: m.index };
  }

  // 4. Spacing
  let s;
  const dbl = / {2,}/g;
  while ((s = dbl.exec(text))) add(s.index, s[0].length, "Spacing", "DOUBLE_SPACE", "There are extra spaces here.", " ");
  const before = /\s+([,.!?;:])/g;
  while ((s = before.exec(text))) add(s.index, s[0].length, "Spacing", "SPACE_BEFORE_PUNCT", "Don't put a space before punctuation.", s[1]);
  const after = /([,;:])(?=[A-Za-z])/g;
  while ((s = after.exec(text))) add(s.index, 1, "Spacing", "SPACE_AFTER_COMMA", "Put a space after a comma.", s[1]+" ");

  return out;
}

/* =========================================================
   LANGUAGETOOL (optional, online — only the sentence is sent, never the name)
   ========================================================= */
function ltType(mt){
  const id = mt.rule.id || "", cat = (mt.rule.category && mt.rule.category.id) || "";
  if (/WHITESPACE|SPACE/.test(id)) return "Spacing";
  if (/MORFOLOGIK|SPELLER|HUNSPELL|SPELLING/.test(id)) return "Spelling";
  if (cat === "CASING") return "Capitalization";
  if (cat === "PUNCTUATION") return "Punctuation";
  if (cat === "CONFUSED_WORDS") return "Word Choice";
  if (["TYPOGRAPHY","STYLE","REDUNDANCY","PLAIN_ENGLISH","COLLOQUIALISMS","SEMANTICS","CREATIVE_WRITING","MISC"].includes(cat) && mt.rule.issueType !== "grammar") return null;
  return "Grammar";
}
async function ltCheck(text){
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 7000);
  try{
    const r = await fetch("https://api.languagetool.org/v2/check", {
      method:"POST", signal: ctl.signal,
      headers:{ "Content-Type":"application/x-www-form-urlencoded" },
      body: new URLSearchParams({ text, language:"en-US" })
    });
    if (!r.ok) throw new Error("LT "+r.status);
    const j = await r.json();
    return (j.matches||[]).map(mt => {
      let type = ltType(mt); if (!type) return null;
      const bad = text.substr(mt.offset, mt.length);
      const reps = mt.replacements || [];
      let sugg = reps[0] ? reps[0].value : "";
      if (sugg && sugg !== bad && sugg.toLowerCase() === bad.toLowerCase()){
        // case-only fix: real capitalization error ("i", "saturday"), or LT guessed a proper noun ("parc" -> "Parc")?
        if (/^i('|$)/.test(bad) || !WORDS || (!isWord(bad) && isWord(sugg))) type = "Capitalization";
        else { const alt = reps.find(r => r.value.toLowerCase() !== bad.toLowerCase()); if (alt){ sugg = alt.value; type = "Spelling"; } }
      }
      return { offset: mt.offset, length: mt.length, bad, type, key: mt.rule.id, message: mt.message, suggestion: sugg,
               sig: mt.rule.id+"|"+bad.toLowerCase(), src:"LanguageTool" };
    }).filter(Boolean);
  } finally { clearTimeout(t); }
}

function overlaps(a,b){ return a.offset < b.offset + Math.max(b.length,1) && b.offset < a.offset + Math.max(a.length,1); }

async function checkSentence(text){
  await ensureDict();
  let errors = builtinCheck(text), source = "built-in checker";
  if (S.useLanguageTool){
    try{
      const allowed = allowedWords();
      const lt = (await ltCheck(text)).filter(l => !(l.type === "Spelling" && allowed.has(l.bad.toLowerCase().replace(/'s$/,""))));
      errors = errors.filter(b => b.key !== "DICT_SPELL");   // LanguageTool's speller replaces the offline dictionary
      const ltEndPunct = lt.some(l => l.type === "Punctuation" && l.offset + l.length >= text.length);
      errors = lt.concat(errors.filter(b => !lt.some(l => overlaps(l,b)) && !(b.key === "END_PUNCT" && ltEndPunct)));
      source = "LanguageTool + built-in checker";
    }catch(e){ source = "built-in checker (LanguageTool was unavailable)"; }
  }
  if (!S.countSpacing) errors = errors.filter(e => e.type !== "Spacing");
  // one error per spot (e.g. sentence-initial "i" is both CAP_START and CAP_I)
  errors = errors.filter((e,i) => !errors.some((o,j) => j < i && o.type === e.type && overlaps(o,e)));
  errors.sort((a,b) => a.offset - b.offset);
  return { errors, source };
}

/* =========================================================
   DIFF — did the student touch the spot where each error was?
   ========================================================= */
function tokenize(s){ const out=[]; const re=/[A-Za-z0-9']+|\s+|[^A-Za-z0-9'\s]/g; let m; while((m=re.exec(s))) out.push({t:m[0], o:m.index}); return out; }
function diffTokens(origText, newText){
  const a = tokenize(origText), b = tokenize(newText), n=a.length, m=b.length;
  const dp = Array.from({length:n+1}, ()=>new Uint16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) dp[i][j] = a[i].t===b[j].t ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const changed=[], inserts=[], pairs=[]; let i=0, j=0;
  while (i<n && j<m){
    if (a[i].t===b[j].t){ pairs.push([a[i], b[j]]); i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]){ changed.push(a[i]); i++; }
    else { inserts.push(a[i].o); j++; }
  }
  while (i<n){ changed.push(a[i]); i++; }
  while (j<m){ inserts.push(origText.length); j++; }
  // where did an original span end up in the new text? (bounded by unchanged tokens on each side)
  const mapSpan = (start, end) => {
    let ns = 0, ne = newText.length;
    pairs.forEach(([x,y]) => {
      if (x.o + x.t.length <= start) ns = y.o + y.t.length;
      else if (x.o >= end && ne === newText.length) ne = y.o;
    });
    return [ns, ne];
  };
  return { changed, inserts, mapSpan };
}

function scoreCorrections(original, corrected, origErrors, afterErrors){
  const d = diffTokens(original, corrected);
  const used = new Set();
  const results = origErrors.map(e => {
    const touched = d.changed.some(tk => tk.o < e.offset+e.length && tk.o+tk.t.length > e.offset)
                 || d.inserts.some(p => p >= e.offset && p <= e.offset+e.length);
    let idx = afterErrors.findIndex((a,k) => !used.has(k) &&
                 (a.sig === e.sig || (a.type === e.type && a.bad && a.bad.toLowerCase() === e.bad.toLowerCase())));
    if (idx < 0 && touched){
      // student edited this spot but left a same-type error there (e.g. "becuz" -> "becaus")
      const [ns, ne] = d.mapSpan(e.offset, e.offset + e.length);
      idx = afterErrors.findIndex((a,k) => !used.has(k) && a.type === e.type && a.offset < ne && a.offset + a.length > ns);
    }
    let status;
    if (idx >= 0){ used.add(idx); status = touched ? "tried" : "missed"; }
    else status = "fixed";
    return Object.assign({}, e, { status });
  });
  const newErrors = afterErrors.filter((a,k) => !used.has(k));
  return { results, newErrors };
}

function applyAllFixes(text, errors){
  let out = text, lastStart = Infinity;
  [...errors].sort((a,b)=>b.offset-a.offset).forEach(e => {
    const rep = e.insert != null ? e.insert : e.suggestion;
    if (!rep || e.offset+e.length > lastStart) return;
    out = out.slice(0,e.offset) + rep + out.slice(e.offset+e.length);
    lastStart = e.offset;
  });
  return out;
}

let SESSION = null, TRIAL = null;

function choosePrompt(){
  if (S.promptMode === "free") return "Write a sentence about anything you want.";
  let list = PROMPTS;
  if (S.promptMode === "custom"){
    const c = S.customPrompts.split("\n").map(x=>x.trim()).filter(Boolean);
    if (c.length) list = c;
  }
  const usedP = SESSION ? SESSION.trials.map(t=>t.prompt) : [];
  const pool = list.filter(p => !usedP.includes(p));
  const src = pool.length ? pool : list;
  return src[Math.floor(Math.random()*src.length)];
}

async function submitOriginal(){
  const text = $("txt").value.trim().replace(/\n+/g," ");
  if (!text) return;
  $("go").disabled = true; $("go").textContent = "Checking…";
  TRIAL.original = text;
  TRIAL.writeSecs = Math.round((Date.now()-TRIAL.startedAt)/1000);
  const res = await checkSentence(text);
  TRIAL.origErrors = res.errors;
  TRIAL.source = res.source;
  if (!res.errors.length){
    TRIAL.corrected = text; TRIAL.results = []; TRIAL.newErrors = []; TRIAL.fixSecs = 0;
    finishTrial(); return;
  }
  TRIAL.fixStartedAt = Date.now();
  renderCorrect();
}

function renderCorrect(){
  const n = TRIAL.origErrors.length;
  $("app").innerHTML = `<div class="card">
      ${progressText()}
      <p class="bigcount">I found ${n} mistake${n===1?"":"s"} in your sentence.</p>
      <div class="dots">${Array.from({length:n},(_,i)=>`<div class="dot">${i+1}</div>`).join("")}</div>
      <p style="font-size:21px">Read your sentence carefully. Can you find and fix ${n===1?"it":"all "+n}? 🔍</p>
      <p class="muted small">Look for: capital letters • end marks • spelling • missing or extra words</p>
      <textarea id="txt" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off"></textarea>
      <div class="row">
        <button class="btn big" id="go" onclick="submitCorrection()">I fixed my mistakes</button>
        <button class="btn ghost" onclick="speak($('txt').value)">🔊 Read my sentence</button>
      </div>
    </div>`;
  $("txt").value = TRIAL.original;
  $("txt").focus();
}

async function submitCorrection(){
  const text = $("txt").value.trim().replace(/\n+/g," ");
  if (text === TRIAL.original && !TRIAL.okNoChange){
    // pop-up dialogs are blocked inside Google Sites embeds, so ask on the page instead
    TRIAL.okNoChange = true;
    $("go").textContent = "Yes, I'm done";
    $("go").insertAdjacentHTML("beforebegin", `<p class="status warn" style="width:100%;margin:0">You didn't change anything yet. Look again, or tap <b>Yes, I'm done</b>.</p>`);
    return;
  }
  $("go").disabled = true; $("go").textContent = "Checking…";
  TRIAL.corrected = text || TRIAL.original;
  TRIAL.fixSecs = Math.round((Date.now()-TRIAL.fixStartedAt)/1000);
  const after = await checkSentence(TRIAL.corrected);
  const sc = scoreCorrections(TRIAL.original, TRIAL.corrected, TRIAL.origErrors, after.errors);
  TRIAL.results = sc.results; TRIAL.newErrors = sc.newErrors;
  finishTrial();
}

function summarizeTrial(t){
  const total = t.results.length;
  const fixed = t.results.filter(r=>r.status==="fixed").length;
  const tried = t.results.filter(r=>r.status==="tried").length;
  const missed = t.results.filter(r=>r.status==="missed").length;
  return { total, found: fixed+tried, fixed, tried, missed, newErrors: (t.newErrors||[]).length };
}

function finishTrial(){
  TRIAL.finishedAt = Date.now();
  TRIAL.stats = summarizeTrial(TRIAL);
  TRIAL.modelSentence = applyAllFixes(TRIAL.original, TRIAL.origErrors);
  SESSION.trials.push(TRIAL);
  renderResults();
}

function highlight(text, results){
  let html = "", pos = 0;
  [...results].sort((a,b)=>a.offset-b.offset).forEach(r => {
    if (r.offset < pos) return;
    html += esc(text.slice(pos, r.offset)) + `<mark class="${r.status}">${esc(text.substr(r.offset, r.length)) || "&nbsp;"}</mark>`;
    pos = r.offset + r.length;
  });
  return html + esc(text.slice(pos));
}

const STATUS_LABEL = { fixed:"✅ You fixed it", tried:"🟡 You found it, but it's still not right", missed:"❌ You didn't find this one" };

function errorRow(r){
  const sugg = r.suggestion ? ` → <b>${esc(r.suggestion)}</b>` : "";
  return `<div class="err"><span class="badge ${r.status}">${r.type}</span>
    <div><div>You wrote “<b>${esc(r.bad)}</b>”${sugg}</div><div class="muted small">${esc(r.message)}</div></div></div>`;
}

function renderResults(){
  const t = TRIAL, st = t.stats;
  const n = Math.max(1, +S.sentencesPerSession||1);
  const more = SESSION.trials.length < n;
  const nextBtn = more ? `<button class="btn big" onclick="startTrial()">Next sentence ➜</button>`
                       : `<button class="btn big" onclick="finishSession()">Finish & send to my teacher 📨</button>`;
  if (!st.total){
    $("app").innerHTML = `<div class="card" style="text-align:center">
      <div class="stars">⭐⭐⭐</div><h2>Perfect sentence!</h2>
      <p class="sentence">${esc(t.original)}</p>
      <p>I didn't find any mistakes. Great job!</p>
      <div class="row" style="justify-content:center">${nextBtn}</div></div>`;
    return;
  }
  const stars = st.fixed === st.total ? "⭐⭐⭐" : st.fixed/st.total >= 0.5 ? "⭐⭐" : "⭐";
  const notFound = t.results.filter(r=>r.status!=="fixed");
  const fixedList = t.results.filter(r=>r.status==="fixed");
  $("app").innerHTML = `<div class="card">
      <div style="text-align:center"><div class="stars">${stars}</div>

      ${fixedList.length ? `<h3>Mistakes you fixed 🎉</h3>${fixedList.map(errorRow).join("")}` : ""}
      ${t.newErrors.length ? `<h3>New mistakes from your changes</h3>${t.newErrors.map(e=>errorRow(Object.assign({},e,{status:"tried"}))).join("")}` : ""}
      <h3>Here's the sentence with every fix</h3>
      <div class="sentence">${esc(t.modelSentence)} <button class="iconbtn" onclick="speak(TRIAL.modelSentence)">🔊</button></div>
      <div class="row">${nextBtn}</div>

function sessionTotals(sess){
  const tot = { sentences: sess.trials.length, total:0, found:0, fixed:0, tried:0, missed:0, newErrors:0, byType:{} };
  sess.trials.forEach(t => {
    ["total","found","fixed","tried","missed","newErrors"].forEach(k => tot[k] += t.stats[k]);
    t.results.forEach(r => {
      const b = tot.byType[r.type] = tot.byType[r.type] || { total:0, fixed:0 };
      b.total++; if (r.status==="fixed") b.fixed++;
    });
  });
  tot.pctFound = pct(tot.found, tot.total);
  tot.pctFixed = pct(tot.fixed, tot.total);
  return tot;
}

function buildReport(sess){
  const T = sessionTotals(sess);
  const date = fmtDate(sess.startedAt);
  const subject = `Sentence Writing Data – ${sess.student} – ${new Date(sess.startedAt).toLocaleDateString()}`;
  const statusTxt = { fixed:"Corrected", tried:"Found, not corrected", missed:"Not found" };
  const statusColor = { fixed:"#1f9d55", tried:"#b7791f", missed:"#c53030" };

  // ----- HTML -----
  let h = `<div style="font-family:Segoe UI,Arial,sans-serif;font-size:14px;color:#1d2433;max-width:720px">
  <h2 style="margin:0 0 4px">Sentence Writing Data Report</h2>
  <div><b>Student:</b> ${esc(sess.student)}<br><b>Date:</b> ${esc(date)}${S.goalNote?`<br><b>Goal:</b> ${esc(S.goalNote)}`:""}</div>
  <table cellpadding="6" style="border-collapse:collapse;margin:12px 0;border:1px solid #d9e0ea">
   <tr style="background:#f5f7fa"><th align="left">Sentences</th><th align="left">Errors made</th><th align="left">Errors found</th><th align="left">Errors corrected</th><th align="left">Not found</th><th align="left">% corrected</th></tr>
   <tr><td>${T.sentences}</td><td>${T.total}</td><td>${T.found} (${T.pctFound}%)</td><td>${T.fixed}</td><td>${T.missed}</td><td><b>${T.pctFixed}%</b></td></tr>
  </table>`;
  const types = Object.keys(T.byType);
  if (types.length){
    h += `<div><b>By error type:</b> ${types.map(k=>`${esc(k)} ${T.byType[k].fixed}/${T.byType[k].total} corrected`).join(" • ")}</div>`;
  }
  sess.trials.forEach((t,i) => {
    h += `<hr style="border:0;border-top:1px solid #d9e0ea;margin:16px 0">
    <h3 style="margin:0 0 6px">Sentence ${i+1}</h3>
    <div><b>Prompt:</b> ${esc(t.prompt)}</div>
    <div><b>Original sentence:</b> ${esc(t.original)}</div>
    <div><b>Student's corrected sentence:</b> ${esc(t.corrected)}</div>
    <div><b>Errors made:</b> ${t.stats.total} &nbsp; <b>Found:</b> ${t.stats.found} &nbsp; <b>Corrected:</b> ${t.stats.fixed} &nbsp; <b>Not found:</b> ${t.stats.missed}
      &nbsp; <b>Time:</b> ${t.writeSecs}s writing, ${t.fixSecs||0}s correcting</div>`;
    if (t.results.length){
      h += `<table cellpadding="5" style="border-collapse:collapse;margin-top:6px;border:1px solid #d9e0ea;width:100%">
        <tr style="background:#f5f7fa"><th align="left">Type</th><th align="left">Student wrote</th><th align="left">Correct</th><th align="left">Result</th></tr>
        ${t.results.map(r=>`<tr><td>${esc(r.type)}</td><td>${esc(r.bad)}</td><td>${esc(r.suggestion)}</td>
          <td style="color:${statusColor[r.status]};font-weight:600">${statusTxt[r.status]}</td></tr>`).join("")}
      </table>`;
    } else h += `<div style="color:#1f9d55"><b>No errors – perfect sentence.</b></div>`;
    if (t.newErrors.length) h += `<div style="margin-top:4px"><b>New errors introduced while correcting:</b> ${t.newErrors.map(e=>`${esc(e.type)} (“${esc(e.bad)}”)`).join(", ")}</div>`;
  });
  h += `<p style="color:#5b6578;font-size:12px;margin-top:18px">Sent automatically by Sentence Builder. Checked with: ${esc(sess.trials[0] ? sess.trials[0].source : "")}.</p></div>`;

  // ----- Plain text -----
  let x = `SENTENCE WRITING DATA REPORT\nStudent: ${sess.student}\nDate: ${date}\n${S.goalNote?"Goal: "+S.goalNote+"\n":""}\n`;
  x += `SUMMARY: ${T.sentences} sentence(s) | Errors made: ${T.total} | Found: ${T.found} (${T.pctFound}%) | Corrected: ${T.fixed} | Not found: ${T.missed} | % corrected: ${T.pctFixed}%\n`;
  if (types.length) x += `By type: ${types.map(k=>`${k} ${T.byType[k].fixed}/${T.byType[k].total}`).join(", ")}\n`;
  sess.trials.forEach((t,i) => {
    x += `\n--- Sentence ${i+1} ---\nPrompt: ${t.prompt}\nOriginal: ${t.original}\nCorrected by student: ${t.corrected}\n`;
    x += `Errors made: ${t.stats.total} | Found: ${t.stats.found} | Corrected: ${t.stats.fixed} | Not found: ${t.stats.missed}\n`;
    t.results.forEach(r => x += `  • ${r.type}: "${r.bad}" -> "${r.suggestion}" — ${statusTxt[r.status]}\n`);
    if (t.newErrors.length) x += `  New errors introduced: ${t.newErrors.map(e=>`${e.type} ("${e.bad}")`).join(", ")}\n`;
  });

  // ----- Spreadsheet rows (one per sentence) -----
  const rows = sess.trials.map((t,i) => [
    new Date(sess.startedAt).toISOString(), sess.student, i+1, t.prompt, t.original, t.corrected,
    t.stats.total, t.stats.found, t.stats.fixed, t.stats.missed, pct(t.stats.fixed, t.stats.total),
    t.results.map(r=>`${r.type}: "${r.bad}"→"${r.suggestion}" [${statusTxt[r.status]}]`).join("; "),
    t.newErrors.length, t.writeSecs, t.fixSecs||0
  ]);

  return { subject, html: h, text: x, rows, totals: T };
}

function recipients(){ return TEACHER_EMAIL; }

async function sendViaScript(payload){
  // text/plain avoids a CORS preflight; Apps Script reads e.postData.contents
  await fetch(S.scriptUrl, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
}

async function flushOutbox(){
  if (!S.scriptUrl || !OUTBOX.length || navigator.onLine === false) return;
  const remaining = [];
  for (const item of OUTBOX){
    try{
      await sendViaScript(item);
      const h = HISTORY.find(x=>x.id===item.sessionId); if (h){ h.emailed = true; }
    }catch(e){ remaining.push(item); }
  }
  OUTBOX = remaining; lsSet(LS.outbox, OUTBOX); lsSet(LS.history, HISTORY);
}

async function finishSession(){
  const rep = buildReport(SESSION);
  const record = { id: SESSION.id, student: SESSION.student, startedAt: SESSION.startedAt, trials: SESSION.trials, totals: rep.totals, emailed:false };
  HISTORY.push(record); lsSet(LS.history, HISTORY);
  window.LAST_REPORT = rep;

  $("app").innerHTML = `<div class="card" style="text-align:center"><h2>Sending your work to your teacher… 📨</h2></div>`;
  let statusHtml;
  if (S.scriptUrl){
    const payload = { token:S.scriptToken, to:recipients(), subject:rep.subject, html:rep.html, text:rep.text, rows:rep.rows, sessionId:SESSION.id };
    try{
      await sendViaScript(payload);
      record.emailed = true; lsSet(LS.history, HISTORY);
      statusHtml = `<div class="status ok">✔ Your report was sent to your teacher.</div>`;
    }catch(e){
      OUTBOX.push(payload); lsSet(LS.outbox, OUTBOX);
      statusHtml = `<div class="status warn">The internet isn't working right now. Your report is saved and will send automatically next time the app opens.</div>`;
    }
  } else {
    statusHtml = `<div class="row" style="justify-content:center">
        <button class="btn big" onclick="mailtoReport()">✉️ Email my teacher</button></div>
      <p class="muted small">Automatic sending isn't set up yet, so this opens a ready-to-send email.</p>`;
  }
  const T = rep.totals;
  $("app").innerHTML = `<div class="card" style="text-align:center">
     <div class="stars">🎉</div><h2>All done, ${esc(SESSION.student)}!</h2>
     <p style="font-size:21px">You made ${T.total} mistake${T.total===1?"":"s"} and fixed ${T.fixed} of them by yourself.</p>
     ${statusHtml}
     <div class="row" style="justify-content:center;margin-top:22px"><button class="btn ghost" onclick="renderHome()">Back to start</button></div>
   </div>`;
}

function mailtoReport(rep){
  rep = rep || window.LAST_REPORT; if (!rep) return;
  const url = `mailto:${encodeURIComponent(TEACHER_EMAIL)}?subject=${encodeURIComponent(rep.subject)}&body=${encodeURIComponent(rep.text)}`;
  // a target=_blank link works inside embedded frames (Google Sites), where changing location.href may be blocked
  const a = document.createElement("a");
  a.href = url; a.target = "_blank"; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
}

function flash(msg, kind){
  let el = $("flash");
  if (!el){ el = document.createElement("div"); el.id = "flash"; document.body.appendChild(el);
    el.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;padding:12px 18px;border-radius:12px;font-size:16px;box-shadow:0 4px 16px rgba(0,0,0,.15);max-width:90vw"; }
  el.className = "status " + (kind || "ok"); el.textContent = msg; el.style.display = "";
  clearTimeout(el._t); el._t = setTimeout(() => el.style.display = "none", 4000);
}

  </div>
  <div class="row"><button class="btn" onclick="saveSettingsForm()">Save settings</button>
    <span id="saved" class="muted small"></span></div>`;
}

function saveSettingsForm(){
  ["goalNote","promptMode","customPrompts","allowedWords","pin"].forEach(k => S[k] = $("s_"+k).value.trim());
  S.sentencesPerSession = Math.min(10, Math.max(1, parseInt($("s_sentencesPerSession").value)||1));
  S.useLanguageTool = $("s_useLanguageTool").checked;
  S.countSpacing = $("s_countSpacing").checked;
  saveSettings(); updateChip();
  $("saved").textContent = "Saved ✔";
}

async function testLT(){
  $("ltStatus").textContent = "Testing…";
  try{
    const r = await ltCheck("I lik my dogg.");
    $("ltStatus").innerHTML = r.length ? `<span style="color:var(--ok)">✔ LanguageTool is working on this network.</span>`
                                       : `<span style="color:var(--warn)">Connected, but it returned no results.</span>`;
  }catch(e){
    $("ltStatus").innerHTML = `<span style="color:var(--bad)">✖ Can't reach LanguageTool from this network (it may be blocked). The offline dictionary will still check spelling.</span>`;
  }
}

function renderDataTab(){
  const rows = [...HISTORY].reverse();
  const unsent = OUTBOX.length;
  return `<p class="muted small">Every session is saved on this computer. ${unsent?`<b>${unsent} report(s) waiting to send.</b>`:""}</p>
  <div class="row" style="margin:0 0 12px">
    <button class="btn" onclick="exportCSV()">⬇ Download CSV (one row per sentence)</button>
    ${unsent?`<button class="btn ghost" onclick="flushOutbox().then(renderTeacher)">Retry sending</button>`:""}
    <button class="btn danger" onclick="clearHistory()">Clear all data</button>
  </div>
  ${rows.length ? `<div class="tablewrap"><table>
    <tr><th>Date</th><th>Student</th><th>Sentences</th><th>Errors</th><th>Found</th><th>Corrected</th><th>% Corr.</th><th>Emailed</th><th></th></tr>
    ${rows.map(r=>`<tr><td>${esc(fmtDate(r.startedAt))}</td><td>${esc(r.student)}</td><td>${r.totals.sentences}</td><td>${r.totals.total}</td>
      <td>${r.totals.found}</td><td>${r.totals.fixed}</td><td>${r.totals.pctFixed}%</td><td>${r.emailed?"✔":"—"}</td>
      <td><button class="btn ghost small" style="padding:4px 10px;font-size:13px" onclick="resend(${r.id})">Email</button></td></tr>`).join("")}
  </table></div>` : `<p>No sessions yet.</p>`}`;
}

function resend(id){
  const r = HISTORY.find(x=>x.id===id); if (!r) return;
  const rep = buildReport(r);
  if (S.scriptUrl){
    sendViaScript({ token:S.scriptToken, to:recipients(), subject:rep.subject, html:rep.html, text:rep.text, rows:[], sessionId:id })
      .then(()=>{ r.emailed = true; lsSet(LS.history, HISTORY); renderTeacher(); flash("Report sent."); })
      .catch(()=>flash("Couldn't reach the internet. Try again later.", "warn"));
  } else mailtoReport(rep);
}

function clearHistory(){
  const b = document.querySelector("button.btn.danger");
  if (!b.dataset.armed){
    b.dataset.armed = "1"; b.textContent = "Tap again to delete everything";
    flash("Download the CSV first if you need it. Tap the red button again to delete.", "warn");
    return;
  }
  HISTORY = []; lsSet(LS.history, HISTORY); renderTeacher(); flash("All saved sessions deleted.");
}

function exportCSV(){
  const head = ["Date","Student","Sentence #","Prompt","Original sentence","Student corrected sentence","Errors made","Errors found","Errors corrected","Errors not found","% corrected","Error details","New errors introduced","Seconds writing","Seconds correcting"];
  const lines = [head];
  HISTORY.forEach(s => buildReport(s).rows.forEach(r => lines.push(r)));
  const csv = lines.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿"+csv], {type:"text/csv"}));
  a.download = `sentence-builder-data-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function renderEmailTab(){
  return `<p>To email reports <b>automatically</b>, connect a free Google Apps Script (one-time, about 5 minutes). Follow <code>SETUP.md</code>, which is in the same folder as this app.</p>
  <p class="muted small">If you skip this step, the app still works. At the end of a session it shows an <b>Open email to teacher</b> button that opens a pre-filled email.</p>
  <label class="f">Apps Script Web App URL</label>
  <input type="text" id="s_scriptUrl" value="${esc(S.scriptUrl)}" placeholder="https://script.google.com/macros/s/.../exec">
  <label class="f">Secret token (must match TOKEN in the script)</label>
  <input type="text" id="s_scriptToken" value="${esc(S.scriptToken)}">
  <div class="row"><button class="btn" onclick="saveEmailForm()">Save</button>
    <button class="btn ghost" onclick="testEmail()">Send test email</button><span id="saved" class="muted small"></span></div>`;
}
function saveEmailForm(){
  S.scriptUrl = $("s_scriptUrl").value.trim(); S.scriptToken = $("s_scriptToken").value.trim();
  saveSettings(); $("saved").textContent = "Saved ✔";
}
async function testEmail(){
  saveEmailForm();
  if (!S.scriptUrl){ $("saved").textContent = "Enter the Web App URL first."; return; }
  try{
    await sendViaScript({ token:S.scriptToken, to:recipients(), subject:"Sentence Builder – test email",
      html:"<p>This is a test from Sentence Builder. If you got this, automatic reports are working.</p>", text:"Test from Sentence Builder.", rows:[] });
    $("saved").textContent = "Test sent. Check the inbox in a minute (and the spam folder).";
  }catch(e){ $("saved").textContent = "Could not reach the script. Check the URL and the internet connection."; }
}

   ========================================================= */
window.addEventListener("online", flushOutbox);
renderHome();
setTimeout(ensureDict, 50);
flushOutbox();
</script>
